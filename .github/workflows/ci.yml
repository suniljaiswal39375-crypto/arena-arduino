name: CI

on:
  push:
    branches: [main, arena/01a0d4ab-arena-arduino]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, behaviour and render tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser and offline regressions
        run: npm run test:e2e

  real-avr:
    name: Official arduino-cli / Arduino AVR core integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned official Arduino action; the sandbox itself cannot reach the
      # GitHub release-asset / downloads.arduino.cc hosts.
      - uses: arduino/setup-arduino-cli@7ef629dcdf0f458ab7ae83149d629443deac6eac # v2.0.0
        with:
          version: '1.5.1'

      - run: arduino-cli core update-index && arduino-cli core install arduino:avr

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Compile a real sketch and execute its HEX on avr8js
        env:
          SPARKLAB_REAL_ARDUINO_CLI: arduino-cli
          SPARKLAB_ARDUINO_CLI: arduino-cli
          SPARKLAB_FW_COMPILE_MS: '120000'
        run: npm test -- src/server/firmware/real-cli.integration.test.ts

  farm-container:
    name: Networkless Docker AVR build farm and SSE
    needs: real-avr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned AVR CLI/core image
        run: docker build --progress=plain -f build-farm/Dockerfile -t sparklab-avr-builder:ci build-farm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile in an isolated container and stream its HEX to avr8js
        env:
          SPARKLAB_TEST_FARM_IMAGE: sparklab-avr-builder:ci
        run: npm test -- src/server/firmware/farm.integration.test.ts

  scenarios:
    name: Automation scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run every example scenario
        uses: ./.github/actions/simulate
        with:
          path: examples
          junit-report: scenario-results.xml

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results
          path: scenario-results.xml
