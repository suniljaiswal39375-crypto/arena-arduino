name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, behaviour and render tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser and offline regressions
        run: npm run test:e2e

  scenarios:
    name: Automation scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run every example scenario
        uses: ./.github/actions/simulate
        with:
          path: examples
          junit-report: scenario-results.xml

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results
          path: scenario-results.xml
